<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <!-- Seguridad: evita que la página sea embebida en iframes (clickjacking) -->
  <meta http-equiv="Content-Security-Policy" content="frame-ancestors 'none'">
  <title>Iniciar sesión</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --azul:        #2563eb;
      --azul-hover:  #1d4ed8;
      --azul-suave:  #eff6ff;
      --rojo:        #dc2626;
      --rojo-suave:  #fef2f2;
      --verde:       #16a34a;
      --verde-suave: #f0fdf4;
      --gris-50:     #f9fafb;
      --gris-100:    #f3f4f6;
      --gris-200:    #e5e7eb;
      --gris-400:    #9ca3af;
      --gris-600:    #4b5563;
      --gris-900:    #111827;
      --radio:       10px;
      --sombra:      0 4px 24px rgba(0,0,0,0.08);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--gris-100);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      color: var(--gris-900);
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: var(--sombra);
      width: 100%;
      max-width: 420px;
      padding: 40px 36px;
    }

    /* Logo / marca */
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .logo-icono {
      width: 40px;
      height: 40px;
      background: var(--azul);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-icono svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; }
    .logo-texto { font-size: 18px; font-weight: 700; color: var(--gris-900); }

    /* Títulos de sección */
    .titulo {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--gris-900);
    }
    .subtitulo {
      font-size: 14px;
      color: var(--gris-600);
      margin-bottom: 28px;
      line-height: 1.5;
    }

    /* Campos */
    .campo {
      margin-bottom: 18px;
    }
    .campo label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--gris-600);
      margin-bottom: 6px;
      letter-spacing: 0.02em;
    }
    .campo input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--gris-200);
      border-radius: var(--radio);
      font-size: 15px;
      color: var(--gris-900);
      background: #fff;
      outline: none;
      transition: border-color 0.15s;
    }
    .campo input:focus {
      border-color: var(--azul);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }
    .campo input:disabled {
      background: var(--gris-50);
      color: var(--gris-400);
      cursor: not-allowed;
    }

    /* Input con ojo (contraseña) */
    .input-wrapper {
      position: relative;
    }
    .input-wrapper input { padding-right: 44px; }
    .btn-ojo {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: var(--gris-400);
      display: flex;
      align-items: center;
    }
    .btn-ojo:hover { color: var(--gris-600); }
    .btn-ojo svg { width: 18px; height: 18px; }

    /* Botón principal */
    .btn {
      width: 100%;
      padding: 13px;
      background: var(--azul);
      color: #fff;
      border: none;
      border-radius: var(--radio);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }
    .btn:hover:not(:disabled) { background: var(--azul-hover); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Spinner dentro del botón */
    .spinner {
      width: 17px;
      height: 17px;
      border: 2.5px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: girar 0.7s linear infinite;
      display: none;
    }
    @keyframes girar { to { transform: rotate(360deg); } }
    .btn.cargando .spinner { display: block; }
    .btn.cargando .btn-texto { display: none; }

    /* Mensajes */
    #mensaje-error, #mensaje-exito {
      display: none;
      padding: 12px 14px;
      border-radius: var(--radio);
      font-size: 14px;
      margin-bottom: 18px;
      line-height: 1.5;
    }
    #mensaje-error {
      background: var(--rojo-suave);
      color: var(--rojo);
      border: 1px solid #fca5a5;
    }
    #mensaje-exito {
      background: var(--verde-suave);
      color: var(--verde);
      border: 1px solid #86efac;
    }

    /* Link olvidé contraseña */
    .enlace-reset {
      text-align: right;
      margin-top: -10px;
      margin-bottom: 18px;
    }
    .enlace-reset button {
      background: none;
      border: none;
      color: var(--azul);
      font-size: 13px;
      cursor: pointer;
      padding: 0;
    }
    .enlace-reset button:hover { text-decoration: underline; }

    /* Separador entre vistas */
    .volver {
      margin-top: 20px;
      text-align: center;
    }
    .volver button {
      background: none;
      border: none;
      color: var(--azul);
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .volver button:hover { text-decoration: underline; }

    /* Contador de intentos */
    .intentos-aviso {
      font-size: 12px;
      color: var(--rojo);
      margin-top: 6px;
      display: none;
    }

    /* Ocultar secciones */
    .vista { display: none; }
    .vista.activa { display: block; }

    /* Indicador de fortaleza de contraseña (solo en change-password) */
    .fuerza-barra {
      height: 4px;
      border-radius: 2px;
      background: var(--gris-200);
      margin-top: 8px;
      overflow: hidden;
    }
    .fuerza-barra-inner {
      height: 100%;
      width: 0%;
      border-radius: 2px;
      transition: width 0.3s, background 0.3s;
    }
    .fuerza-texto {
      font-size: 12px;
      margin-top: 4px;
      color: var(--gris-400);
    }
  </style>
</head>
<body>

<div class="card">

  <!-- LOGO -->
  <div class="logo">
    <div class="logo-icono">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
    </div>
    <span class="logo-texto">Mi Sistema</span>
  </div>

  <!-- ======================================================
       VISTA 1: LOGIN
  ====================================================== -->
  <div id="vista-login" class="vista activa">
    <h1 class="titulo">Iniciar sesión</h1>
    <p class="subtitulo">Ingresa tus credenciales para continuar.</p>

    <div id="mensaje-error"></div>
    <div id="mensaje-exito"></div>

    <div class="campo">
      <label for="login-email">Correo electrónico</label>
      <input
        type="email"
        id="login-email"
        placeholder="tucorreo@ejemplo.com"
        autocomplete="email"
        maxlength="254"
      >
    </div>

    <div class="campo">
      <label for="login-password">Contraseña</label>
      <div class="input-wrapper">
        <input
          type="password"
          id="login-password"
          placeholder="••••••••"
          autocomplete="current-password"
          maxlength="128"
        >
        <button type="button" class="btn-ojo" onclick="toggleVerContraseña('login-password', this)" aria-label="Mostrar contraseña">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <p class="intentos-aviso" id="aviso-intentos"></p>
    </div>

    <div class="enlace-reset">
      <button type="button" onclick="mostrarVista('vista-reset')">
        ¿Olvidaste tu contraseña?
      </button>
    </div>

    <button class="btn" id="btn-login" onclick="handleLogin()">
      <span class="spinner"></span>
      <span class="btn-texto">Entrar</span>
    </button>
  </div>


  <!-- ======================================================
       VISTA 2: RECUPERAR CONTRASEÑA
       El usuario ingresa su email para que el admin
       sepa que necesita un reset manual
  ====================================================== -->
  <div id="vista-reset" class="vista">
    <h1 class="titulo">Recuperar contraseña</h1>
    <p class="subtitulo">
      Ingresa tu correo. Si está registrado, contactaremos al administrador
      para que te asigne una contraseña temporal.
    </p>

    <div id="mensaje-error"></div>
    <div id="mensaje-exito"></div>

    <div class="campo">
      <label for="reset-email">Correo electrónico</label>
      <input
        type="email"
        id="reset-email"
        placeholder="tucorreo@ejemplo.com"
        autocomplete="email"
        maxlength="254"
      >
    </div>

    <button class="btn" id="btn-reset" onclick="handleReset()">
      <span class="spinner"></span>
      <span class="btn-texto">Solicitar ayuda</span>
    </button>

    <div class="volver">
      <button type="button" onclick="mostrarVista('vista-login')">
        ← Volver al login
      </button>
    </div>
  </div>

</div><!-- fin .card -->


<script type="module">
  import {
    supabase,
    registrarIntentoFallido,
    verificarBloqueo,
    limpiarIntentos
  } from './configuracion.js'

  // ----------------------------------------------------------
  // NAVEGACIÓN ENTRE VISTAS
  // ----------------------------------------------------------
  window.mostrarVista = function(id) {
    document.querySelectorAll('.vista').forEach(v => v.classList.remove('activa'))
    document.getElementById(id).classList.add('activa')
    ocultarMensajes()
  }

  // ----------------------------------------------------------
  // TOGGLE VER/OCULTAR CONTRASEÑA
  // ----------------------------------------------------------
  window.toggleVerContraseña = function(inputId, btn) {
    const input = document.getElementById(inputId)
    const mostrar = input.type === 'password'
    input.type = mostrar ? 'text' : 'password'
    btn.setAttribute('aria-label', mostrar ? 'Ocultar contraseña' : 'Mostrar contraseña')
  }

  // ----------------------------------------------------------
  // MENSAJES
  // ----------------------------------------------------------
  function mostrarError(texto) {
    // Busca el mensaje-error DENTRO de la vista activa
    const vista = document.querySelector('.vista.activa')
    const el = vista?.querySelector('#mensaje-error') || document.getElementById('mensaje-error')
    if (el) { el.textContent = texto; el.style.display = 'block' }
  }

  function mostrarExito(texto) {
    const vista = document.querySelector('.vista.activa')
    const el = vista?.querySelector('#mensaje-exito') || document.getElementById('mensaje-exito')
    if (el) { el.textContent = texto; el.style.display = 'block' }
  }

  function ocultarMensajes() {
    document.querySelectorAll('#mensaje-error, #mensaje-exito').forEach(el => {
      el.style.display = 'none'
      el.textContent = ''
    })
  }

  // ----------------------------------------------------------
  // ESTADO DEL BOTÓN
  // ----------------------------------------------------------
  function setBotonCargando(id, cargando) {
    const btn = document.getElementById(id)
    btn.disabled = cargando
    btn.classList.toggle('cargando', cargando)
  }

  // ----------------------------------------------------------
  // SANITIZACIÓN BÁSICA (OWASP: input validation)
  // ----------------------------------------------------------
  function sanitizarEmail(email) {
    return email.trim().toLowerCase().slice(0, 254)
  }

  function esEmailValido(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)
  }

  // ----------------------------------------------------------
  // LOGIN
  // ----------------------------------------------------------
  window.handleLogin = async function() {
    ocultarMensajes()

    const email    = sanitizarEmail(document.getElementById('login-email').value)
    const password = document.getElementById('login-password').value

    // Validaciones básicas
    if (!email || !password) {
      mostrarError('Completa todos los campos.')
      return
    }
    if (!esEmailValido(email)) {
      mostrarError('Ingresa un correo válido.')
      return
    }
    if (password.length < 6) {
      mostrarError('La contraseña debe tener al menos 6 caracteres.')
      return
    }

    // Verificar bloqueo por intentos fallidos
    const bloqueo = await verificarBloqueo(email)
    if (bloqueo.bloqueado) {
      mostrarError(`Demasiados intentos fallidos. Intenta en ${bloqueo.minutos_restantes} minuto(s).`)
      return
    }

    setBotonCargando('btn-login', true)

    try {
      const { data, error } = await supabase.auth.signInWithPassword({ email, password })

      if (error) {
        // Registrar intento fallido
        const bloqueadoAhora = await registrarIntentoFallido(email)

        if (bloqueadoAhora) {
          mostrarError('Has superado el límite de intentos. Tu cuenta está bloqueada por 15 minutos.')
        } else {
          // Mensaje genérico (OWASP: no revelar si el email existe o no)
          mostrarError('Correo o contraseña incorrectos.')
        }
        setBotonCargando('btn-login', false)
        return
      }

      // Login exitoso — limpiar intentos fallidos
      await limpiarIntentos(email)

      // Obtener perfil
      const { data: profile, error: errPerfil } = await supabase
        .from('profiles')
        .select('rol, activo, must_change_password')
        .eq('id', data.user.id)
        .single()

      if (errPerfil || !profile) {
        mostrarError('No se encontró tu perfil. Contacta al administrador.')
        await supabase.auth.signOut()
        setBotonCargando('btn-login', false)
        return
      }

      // Verificar cuenta activa
      if (!profile.activo) {
        mostrarError('Tu cuenta está inactiva. Contacta al administrador.')
        await supabase.auth.signOut()
        setBotonCargando('btn-login', false)
        return
      }

      // Verificar cambio de contraseña obligatorio
      if (profile.must_change_password) {
        window.location.href = 'change-password.html'
        return
      }

      // Redirigir según rol
      const rutas = {
        cliente:        'dashboard-client.html',
        vendedor:       'dashboard-vendor.html',
        administrador:  'dashboard-admin.html'
      }

      window.location.href = rutas[profile.rol] || 'login.html'

    } catch (e) {
      mostrarError('Error de conexión. Intenta nuevamente.')
      setBotonCargando('btn-login', false)
    }
  }

  // ----------------------------------------------------------
  // RESET DE CONTRASEÑA
  // El usuario solo declara que necesita ayuda.
  // Se guarda un flag en la base de datos para que el admin lo vea.
  // ----------------------------------------------------------
  window.handleReset = async function() {
    ocultarMensajes()

    const email = sanitizarEmail(document.getElementById('reset-email').value)

    if (!email) {
      mostrarError('Ingresa tu correo electrónico.')
      return
    }
    if (!esEmailValido(email)) {
      mostrarError('Ingresa un correo válido.')
      return
    }

    setBotonCargando('btn-reset', true)

    try {
      // OWASP: no revelar si el correo existe o no
      // Siempre mostramos el mismo mensaje de éxito
      const { data: profile } = await supabase
        .from('profiles')
        .select('id')
        .eq('email', email)
        .single()

      // Si existe, marcamos que necesita ayuda (columna opcional)
      // El admin verá esto en su panel y hará el reset manual
      if (profile) {
        await supabase
          .from('profiles')
          .update({ must_change_password: true })
          .eq('id', profile.id)
      }

      // Siempre el mismo mensaje (no revelamos si el email existe)
      mostrarExito(
        'Si tu correo está registrado, el administrador fue notificado. ' +
        'Te contactaremos pronto con tu contraseña temporal.'
      )

      // Limpiar campo
      document.getElementById('reset-email').value = ''

    } catch (e) {
      // Mismo mensaje para no revelar información
      mostrarExito(
        'Si tu correo está registrado, el administrador fue notificado. ' +
        'Te contactaremos pronto con tu contraseña temporal.'
      )
    }

    setBotonCargando('btn-reset', false)
  }

  // ----------------------------------------------------------
  // ENTER para enviar formularios
  // ----------------------------------------------------------
  document.addEventListener('keydown', function(e) {
    if (e.key !== 'Enter') return
    const vistaActiva = document.querySelector('.vista.activa')?.id
    if (vistaActiva === 'vista-login')  window.handleLogin()
    if (vistaActiva === 'vista-reset')  window.handleReset()
  })

  // ----------------------------------------------------------
  // Si ya hay sesión activa, redirigir al dashboard
  // ----------------------------------------------------------
  ;(async function() {
    const { data: { session } } = await supabase.auth.getSession()
    if (!session) return

    const { data: profile } = await supabase
      .from('profiles')
      .select('rol, activo, must_change_password')
      .eq('id', session.user.id)
      .single()

    if (!profile || !profile.activo) return

    if (profile.must_change_password) {
      window.location.href = 'change-password.html'
      return
    }

    const rutas = {
      cliente:       'dashboard-client.html',
      vendedor:      'dashboard-vendor.html',
      administrador: 'dashboard-admin.html'
    }
    window.location.href = rutas[profile.rol] || '/login.html'
  })()

</script>
</body>
</html>
