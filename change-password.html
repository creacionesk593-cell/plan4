<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="frame-ancestors 'none'">
  <title>Cambiar contraseña</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --azul:       #2563eb;
      --azul-hover: #1d4ed8;
      --rojo:       #dc2626;
      --rojo-suave: #fef2f2;
      --verde:      #16a34a;
      --verde-suave:#f0fdf4;
      --gris-100:   #f3f4f6;
      --gris-200:   #e5e7eb;
      --gris-400:   #9ca3af;
      --gris-600:   #4b5563;
      --gris-900:   #111827;
      --radio:      10px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--gris-100);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 420px;
      padding: 40px 36px;
    }
    .icono-lock {
      width: 48px;
      height: 48px;
      background: #eff6ff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .icono-lock svg { width: 26px; height: 26px; stroke: var(--azul); fill: none; stroke-width: 2; stroke-linecap: round; }
    h1 { font-size: 22px; font-weight: 700; color: var(--gris-900); margin-bottom: 8px; }
    .subtitulo { font-size: 14px; color: var(--gris-600); margin-bottom: 28px; line-height: 1.6; }
    .campo { margin-bottom: 18px; }
    .campo label { display: block; font-size: 13px; font-weight: 600; color: var(--gris-600); margin-bottom: 6px; }
    .input-wrapper { position: relative; }
    .campo input {
      width: 100%;
      padding: 11px 44px 11px 14px;
      border: 1.5px solid var(--gris-200);
      border-radius: var(--radio);
      font-size: 15px;
      color: var(--gris-900);
      outline: none;
      transition: border-color 0.15s;
    }
    .campo input:focus { border-color: var(--azul); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    .btn-ojo {
      position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--gris-400); padding: 4px;
    }
    .btn-ojo svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }

    /* Barra de fortaleza */
    .fuerza-barra { height: 4px; background: var(--gris-200); border-radius: 2px; margin-top: 8px; overflow: hidden; }
    .fuerza-inner { height: 100%; width: 0; border-radius: 2px; transition: width 0.3s, background 0.3s; }
    .fuerza-texto { font-size: 12px; margin-top: 4px; color: var(--gris-400); }

    /* Requisitos */
    .requisitos { margin: 4px 0 18px; padding: 0; list-style: none; }
    .requisitos li {
      font-size: 12px;
      color: var(--gris-400);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
      transition: color 0.2s;
    }
    .requisitos li.ok { color: var(--verde); }
    .requisitos li::before { content: '○'; font-size: 10px; }
    .requisitos li.ok::before { content: '●'; }

    #mensaje-error {
      display: none;
      padding: 12px 14px;
      border-radius: var(--radio);
      font-size: 14px;
      margin-bottom: 18px;
      background: var(--rojo-suave);
      color: var(--rojo);
      border: 1px solid #fca5a5;
    }
    #mensaje-exito {
      display: none;
      padding: 12px 14px;
      border-radius: var(--radio);
      font-size: 14px;
      margin-bottom: 18px;
      background: var(--verde-suave);
      color: var(--verde);
      border: 1px solid #86efac;
    }
    .btn {
      width: 100%;
      padding: 13px;
      background: var(--azul);
      color: #fff;
      border: none;
      border-radius: var(--radio);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, opacity 0.15s;
      margin-top: 8px;
    }
    .btn:hover:not(:disabled) { background: var(--azul-hover); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .spinner {
      width: 17px; height: 17px;
      border: 2.5px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: girar 0.7s linear infinite;
      display: none;
    }
    @keyframes girar { to { transform: rotate(360deg); } }
    .btn.cargando .spinner { display: block; }
    .btn.cargando .btn-texto { display: none; }
  </style>
</head>
<body>
<div class="card">
  <div class="icono-lock">
    <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
  </div>

  <h1>Crea tu nueva contraseña</h1>
  <p class="subtitulo">
    Tu cuenta requiere una nueva contraseña antes de continuar.
    Elige una contraseña segura que no hayas usado antes.
  </p>

  <div id="mensaje-error"></div>
  <div id="mensaje-exito"></div>

  <div class="campo">
    <label for="nueva">Nueva contraseña</label>
    <div class="input-wrapper">
      <input
        type="password"
        id="nueva"
        placeholder="Mínimo 8 caracteres"
        maxlength="128"
        oninput="evaluarFuerza(this.value)"
        autocomplete="new-password"
      >
      <button type="button" class="btn-ojo" onclick="toggleVer('nueva', this)" aria-label="Mostrar contraseña">
        <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <div class="fuerza-barra"><div class="fuerza-inner" id="fuerza-inner"></div></div>
    <p class="fuerza-texto" id="fuerza-texto">Escribe tu contraseña</p>
  </div>

  <ul class="requisitos" id="requisitos">
    <li id="req-largo">Al menos 8 caracteres</li>
    <li id="req-mayus">Una letra mayúscula</li>
    <li id="req-minus">Una letra minúscula</li>
    <li id="req-numero">Un número</li>
    <li id="req-especial">Un carácter especial (!@#$%...)</li>
  </ul>

  <div class="campo">
    <label for="confirmar">Confirmar contraseña</label>
    <div class="input-wrapper">
      <input
        type="password"
        id="confirmar"
        placeholder="Repite la contraseña"
        maxlength="128"
        autocomplete="new-password"
      >
      <button type="button" class="btn-ojo" onclick="toggleVer('confirmar', this)" aria-label="Mostrar contraseña">
        <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </div>

  <button class="btn" id="btn-guardar" onclick="guardarContrasena()">
    <span class="spinner"></span>
    <span class="btn-texto">Guardar contraseña</span>
  </button>
</div>

<script type="module">
  import { supabase, getUser, getProfile } from '.configuracion.js'

  // Verificar que el usuario realmente necesita cambiar contraseña
  ;(async function() {
    const user = await getUser()
    if (!user) { window.location.href = 'login.html'; return }

    const profile = await getProfile(user.id)
    if (!profile) { window.location.href = 'login.html'; return }

    // Si no necesita cambiar contraseña, mandarlo a su dashboard
    if (!profile.must_change_password) {
      const rutas = {
        cliente:       '/dashboard-client.html',
        vendedor:      '/dashboard-vendor.html',
        administrador: '/dashboard-admin.html'
      }
      window.location.href = rutas[profile.rol] || 'login.html'
    }
  })()

  // ----------------------------------------------------------
  // TOGGLE MOSTRAR/OCULTAR
  // ----------------------------------------------------------
  window.toggleVer = function(id, btn) {
    const input = document.getElementById(id)
    input.type = input.type === 'password' ? 'text' : 'password'
  }

  // ----------------------------------------------------------
  // EVALUADOR DE FORTALEZA
  // ----------------------------------------------------------
  window.evaluarFuerza = function(valor) {
    const checks = {
      'req-largo':    valor.length >= 8,
      'req-mayus':    /[A-Z]/.test(valor),
      'req-minus':    /[a-z]/.test(valor),
      'req-numero':   /[0-9]/.test(valor),
      'req-especial': /[^A-Za-z0-9]/.test(valor)
    }

    let cumple = 0
    for (const [id, ok] of Object.entries(checks)) {
      document.getElementById(id).classList.toggle('ok', ok)
      if (ok) cumple++
    }

    const inner = document.getElementById('fuerza-inner')
    const texto = document.getElementById('fuerza-texto')
    const pct   = (cumple / 5) * 100

    inner.style.width = pct + '%'

    if (cumple <= 1) { inner.style.background = '#dc2626'; texto.textContent = 'Muy débil'; texto.style.color = '#dc2626' }
    else if (cumple === 2) { inner.style.background = '#f97316'; texto.textContent = 'Débil'; texto.style.color = '#f97316' }
    else if (cumple === 3) { inner.style.background = '#eab308'; texto.textContent = 'Regular'; texto.style.color = '#eab308' }
    else if (cumple === 4) { inner.style.background = '#84cc16'; texto.textContent = 'Buena'; texto.style.color = '#84cc16' }
    else { inner.style.background = '#16a34a'; texto.textContent = 'Excelente'; texto.style.color = '#16a34a' }
  }

  // ----------------------------------------------------------
  // GUARDAR NUEVA CONTRASEÑA
  // ----------------------------------------------------------
  window.guardarContrasena = async function() {
    const nueva     = document.getElementById('nueva').value
    const confirmar = document.getElementById('confirmar').value
    const errEl     = document.getElementById('mensaje-error')
    const okEl      = document.getElementById('mensaje-exito')

    errEl.style.display = 'none'
    okEl.style.display  = 'none'

    // Validaciones
    if (!nueva || !confirmar) {
      errEl.textContent = 'Completa ambos campos.'; errEl.style.display = 'block'; return
    }
    if (nueva.length < 8) {
      errEl.textContent = 'La contraseña debe tener al menos 8 caracteres.'; errEl.style.display = 'block'; return
    }
    if (!/[A-Z]/.test(nueva) || !/[a-z]/.test(nueva) || !/[0-9]/.test(nueva)) {
      errEl.textContent = 'La contraseña debe tener mayúsculas, minúsculas y números.'; errEl.style.display = 'block'; return
    }
    if (nueva !== confirmar) {
      errEl.textContent = 'Las contraseñas no coinciden.'; errEl.style.display = 'block'; return
    }

    const btn = document.getElementById('btn-guardar')
    btn.disabled = true
    btn.classList.add('cargando')

    try {
      // 1. Actualizar contraseña en Supabase Auth
      const { error } = await supabase.auth.updateUser({ password: nueva })

      if (error) {
        errEl.textContent = 'No se pudo actualizar la contraseña. Intenta nuevamente.'
        errEl.style.display = 'block'
        btn.disabled = false
        btn.classList.remove('cargando')
        return
      }

      // 2. Quitar el flag must_change_password
      const user = await supabase.auth.getUser()
      await supabase
        .from('profiles')
        .update({ must_change_password: false })
        .eq('id', user.data.user.id)

      // 3. Éxito — redirigir al dashboard
      okEl.textContent = '¡Contraseña actualizada! Redirigiendo...'
      okEl.style.display = 'block'

      // Obtener rol para redirigir correctamente
      const { data: profile } = await supabase
        .from('profiles')
        .select('rol')
        .eq('id', user.data.user.id)
        .single()

      setTimeout(() => {
        const rutas = {
          cliente:       'dashboard-client.html',
          vendedor:      'dashboard-vendor.html',
          administrador: 'dashboard-admin.html'
        }
        window.location.href = rutas[profile?.rol] || 'login.html'
      }, 1500)

    } catch (e) {
      errEl.textContent = 'Error inesperado. Intenta nuevamente.'
      errEl.style.display = 'block'
      btn.disabled = false
      btn.classList.remove('cargando')
    }
  }

  // Enter para guardar
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') window.guardarContrasena()
  })
</script>
</body>
</html>
